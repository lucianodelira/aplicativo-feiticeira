
<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>FeiticeiraVIP | Banca Brasileira</title>

  <meta name="description" content="Acesse a plataforma FeiticeiraVIP pela Banca Brasileira. Conteúdo online disponível para dispositivos móveis e computadores.">

  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="googlebot" content="index, follow">
  <meta name="content-language" content="pt-BR">
  <meta name="theme-color" content="#000000">

  <!-- URL CANÔNICA -->
  <link rel="canonical" href="https://www.bancabrasileira.net/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Banca Brasileira">
  <meta property="og:title" content="FeiticeiraVIP | Banca Brasileira">
  <meta property="og:description" content="Acesse a plataforma FeiticeiraVIP online.">
  <meta property="og:url" content="https://www.bancabrasileira.net/">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FeiticeiraVIP | Banca Brasileira">
  <meta name="twitter:description" content="Acesse a plataforma FeiticeiraVIP online.">

  <style>
    /* Reset geral */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: relative;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* IFRAME EM TELA CHEIA */
    #embeddedIframe {
      position: fixed;
      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      width: 100vw;
      height: 100vh;

      /* Altura dinâmica para navegadores móveis */
      height: 100dvh;

      border: none;
      margin: 0;
      padding: 0;

      background: #000;
    }

    /* Compatibilidade com telas de celulares */
    @supports (height: 100svh) {
      #embeddedIframe {
        height: 100vh;
        height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <!-- PLATAFORMA EM TELA CHEIA -->
  <iframe
    id="embeddedIframe"
    src="https://app.feiticeira.club/pr/PRBJ9rmd"
    title="Plataforma FeiticeiraVIP"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

</body>
</html>
